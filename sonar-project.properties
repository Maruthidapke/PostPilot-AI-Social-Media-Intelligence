# SonarQube Community Edition Configuration
sonar.projectKey=postpilot-ai
sonar.projectName=PostPilot AI - Social Media Management & Predictive Intelligence
sonar.projectVersion=1.0.0
sonar.sources=backend,frontend/src,ai-service
sonar.tests=backend/tests,ai-service/tests
sonar.sourceEncoding=UTF-8

# Quality Gate Thresholds
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.coverage.exclusions=**/tests/**,**/node_modules/**,**/dist/**
sonar.cpd.exclusions=**/tests/**,**/data/**

# Threshold Rules
sonar.qualitygate.wait=true
sonar.qualitygate.conditions=coverage:>=80.0,bugs:<=0,vulnerabilities:<=0
