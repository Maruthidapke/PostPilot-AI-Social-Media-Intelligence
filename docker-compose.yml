version: '3.8'

services:
  backend:
    build: ./backend
    container_name: postpilot-backend
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/postpilot
      - JWT_SECRET=postpilot_jwt_super_secret_p59_maruthi_dapke_2026
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: postpilot-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    container_name: postpilot-ai-service
    ports:
      - "8000:8000"
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    container_name: postpilot-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: postpilot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

volumes:
  mongo-data:
