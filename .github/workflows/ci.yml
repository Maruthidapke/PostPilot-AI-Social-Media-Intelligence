name: PostPilot AI Continuous Integration Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies & Run Unit Tests
        run: |
          cd backend
          npm install
          npm test
          node tests/e2e_journey.js

      - name: Execute Python AI Inference Benchmark
        run: |
          cd ai-service
          python3 evaluation/benchmark_runner.py

      - name: Install Frontend Dependencies & Run Production Build
        run: |
          cd frontend
          npm install
          npm run build

      - name: Verify SonarQube Quality Gate Parameters
        run: |
          test -f sonar-project.properties
          echo "SonarQube Quality Gate config validated."
