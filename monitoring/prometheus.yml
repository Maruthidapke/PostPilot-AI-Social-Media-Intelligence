global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'postpilot-backend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['backend:5002', 'host.docker.internal:5002']

  - job_name: 'postpilot-ai-service'
    metrics_path: '/health'
    static_configs:
      - targets: ['ai-service:8000', 'host.docker.internal:8000']
